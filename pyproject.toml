[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "palworld-local-llm-companion"
version = "0.4.0"
description = "Local-first, source-grounded Palworld companion powered by Ollama and RAG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luibot and AyeGuild" }]
dependencies = [
  "discord.py>=2.5,<3",
  "edge-tts>=7,<8",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
pal-companion = "pal_companion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pal_companion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
